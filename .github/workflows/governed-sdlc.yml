name: governed-sdlc
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists a pull request's commits
jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      CHANGE_AUTHOR_KIND: ${{ endsWith(github.actor, '[bot]') && 'agent' || 'human' }}
      CHANGE_AUTHOR_ID: ${{ github.actor }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # The labs are the source of truth for the talk. Replay every printed command and assert its outcome.
      # The upstream main must always be lab-ready. Your fork's main, once you have merged a spec, is not, and neither is
      # a PR that implements one. Both are governed by the gates below instead.
      - run: bash labs/verify.sh
        env: { VERIFY_REQUIRE_BASELINE: "${{ github.event_name == 'push' && github.repository == 'rocketstack-matt/agentic-sdlc-blueprint' }}" }
      - name: Resolve the spec from the PR body (Spec trailer) or the commit message
        run: echo "SPEC=$(printf '%s' "$PR_BODY" | grep -oE 'SPEC-[0-9]+' | head -1)" >> "$GITHUB_ENV"
      - name: Resolve the change under evaluation. A PR is diffed against its base, a push against the commit the branch was at before it
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="origin/$GITHUB_BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then base=HEAD~1
          else base=HEAD; fi
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
      # SDLC-PREV-010 Secret Detection
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # SDLC-PREV-007 Dependency scanning
      - run: npm audit --audit-level=high
      # SDLC-PREV-009 Component Inventory
      # Reports go beside the evidence bundle. An untracked file at the root would count as part of the change under review.
      - name: Collect the secret scan report and the SBOM with the evidence
        run: |
          mkdir -p evidence/out
          [ -f results.sarif ] && mv results.sarif evidence/out/gitleaks.sarif
          npm sbom --sbom-format cyclonedx > evidence/out/sbom.cdx.json
      # SDLC-PREV-012 gating + SDLC-PREV-014 evidence. Fails the job if any blocking gate fails.
      - run: npm run evidence
      - name: Publish the review decision
        if: always()
        run: |
          node gates/review-router.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.sha }}
          path: evidence/out/
          retention-days: 90 # a real retention period comes from your records policy and WORM storage
