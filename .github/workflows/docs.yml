name: docs
# Publishes the CALM model as a website with `calm docify`, with copies of the catalog documents, the Standards and
# the pattern beside it for reference. The model's URLs point at CALM Hub; offline validation resolves them through
# architecture/url-mapping.json. Nothing here is needed to run the labs: attendees never install Docusaurus.
on:
  push:
    branches: [main]
    paths: [architecture/**, slides/**, .github/workflows/docs.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate the site from the model
        run: |
          npx calm docify -a architecture/trade-capture.architecture.json -u architecture/url-mapping.json -o site
          sed -i -e "s#title: 'My Docusaurus Docs'#title: 'Trade Capture architecture'#" \
                 -e "s#url: 'http://localhost'#url: 'https://${GITHUB_REPOSITORY_OWNER}.github.io'#" \
                 -e "s#baseUrl: '/'#baseUrl: '/${GITHUB_REPOSITORY#*/}/'#" \
                 -e "s#organizationName: 'my-org'#organizationName: '${GITHUB_REPOSITORY_OWNER}'#" \
                 -e "s#projectName: 'calm-docs'#projectName: '${GITHUB_REPOSITORY#*/}'#" site/docusaurus.config.js
      - name: Serve copies of the hub documents, the Standards and the pattern
        run: |
          mkdir -p site/static/standards site/static/hub site/static/patterns
          cp architecture/standards/*.standard.json site/static/standards/
          cp architecture/hub/*.json site/static/hub/
          cp architecture/*.pattern.json site/static/patterns/
          cp architecture/trade-capture.architecture.json site/static/
      - name: Publish the talk deck beside the docs
        run: cp -R slides site/static/slides
      - name: Build
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/build }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
